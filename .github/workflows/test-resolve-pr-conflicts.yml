name: test-resolve-pr-conflicts

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to resolve conflicts for"
        required: true
        type: string
      push_resolution:
        description: "Push the resolved changes back to the PR branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve-conflicts:
    if: github.repository_owner == 'alexyaroshuk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Resolve PR conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PUSH_RESOLUTION: ${{ github.event.inputs.push_resolution }}
        run: bun script/test-resolve-pr-conflicts.ts
