name: release-fork
run-name: "fork release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.100)"
        required: true
        type: string
      body:
        description: "Release notes (leave blank to auto-generate from commits)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows*

  build-desktop-windows:
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod

      - name: Package and publish
        run: npx electron-builder --win --x64 --publish always --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod
          GH_TOKEN: ${{ github.token }}

  release-notes:
    needs: build-desktop-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ inputs.body }}
        run: |
          TAG="v${{ inputs.version }}"
          if [ -n "$BODY" ]; then
            gh release edit "$TAG" --notes "$BODY"
          else
            gh release edit "$TAG" --generate-notes
          fi
