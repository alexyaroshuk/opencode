name: release-fork
run-name: "fork release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.100)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-desktop-windows:
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: x86_64-pc-windows-msvc

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          RUST_TARGET: x86_64-pc-windows-msvc
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build and publish desktop
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        timeout-minutes: 60
        with:
          projectPath: packages/desktop
          uploadWorkflowArtifacts: true
          args: >-
            --target x86_64-pc-windows-msvc
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
            --verbose
          tagName: v${{ inputs.version }}
          releaseName: v${{ inputs.version }}
          releaseDraft: true
          releaseBody: |
            Personal fork of [opencode](https://github.com/anomalyco/opencode) — includes unreleased features pending upstream review.

            **Included features:**
            - [View & restore archived sessions](https://github.com/anomalyco/opencode/pull/15250)
            - [Edit config files inside the app](https://github.com/anomalyco/opencode/pull/14617)
            - [Marquee scroll for long sidebar titles](https://github.com/anomalyco/opencode/pull/13210)
          releaseAssetNamePattern: opencode-desktop-[platform]-[arch][ext]
          releaseCommitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
