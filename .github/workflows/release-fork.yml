name: release-fork
run-name: "fork release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.100)"
        required: true
        type: string
      body:
        description: "Release notes (leave blank to auto-generate from commits)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows*

  build-desktop-windows:
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod

      - name: Package and publish
        run: npx electron-builder --win --x64 --publish always --config electron-builder.fork.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}

  publish-cli-fork:
    needs: build-desktop-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-cli-windows
          path: cli-dist

      - name: Rename binary and repackage
        run: |
          set -euo pipefail
          # The artifact preserves the dist/opencode-windows-x64/ directory tree.
          BIN_DIR=$(find cli-dist -type d -name 'opencode-windows-x64' | head -n1)
          if [ -z "$BIN_DIR" ] || [ ! -f "$BIN_DIR/bin/opencode.exe" ]; then
            echo "opencode.exe not found in artifact"
            find cli-dist -maxdepth 4
            exit 1
          fi
          mv "$BIN_DIR/bin/opencode.exe" "$BIN_DIR/bin/opencode-fork.exe"
          (cd "$BIN_DIR/bin" && zip -r "$GITHUB_WORKSPACE/opencode-fork-windows-x64.zip" .)
          ls -la opencode-fork-windows-x64.zip

      - name: Upload CLI + installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          gh release upload "$TAG" \
            opencode-fork-windows-x64.zip \
            script/install-fork.ps1 \
            --clobber

  release-notes:
    needs: publish-cli-fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ inputs.body }}
        run: |
          TAG="v${{ inputs.version }}"
          if [ -n "$BODY" ]; then
            gh release edit "$TAG" --notes "$BODY"
          else
            gh release edit "$TAG" --generate-notes
          fi
